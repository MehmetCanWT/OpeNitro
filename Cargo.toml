[package]
name = "openitro"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Self-contained GPU-accelerated Linux system controller for Acer Nitro and Predator laptops"
license = "MIT"
repository = "https://github.com/MehmetCanWT/OpeNitro"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
